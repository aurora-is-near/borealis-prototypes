syntax = "proto3";

package borealis.payloads.near;

message AccessKeyView {
  uint64 nonce = 1;
  AccessKeyPermissionView permission = 2;
}

message AccessKeyPermissionView {
  message FunctionCall {
    optional bytes u128_allowance = 1;
    string receiver_id = 2;
    repeated string method_names = 3;
  }
  message FullAccess {}
  message GasKeyFunctionCall {
    bytes u128_balance = 1;
    uint32 num_nonces = 2;
    optional bytes u128_allowance = 3;
    string receiver_id = 4;
    repeated string method_names = 5;
  }
  message GasKeyFullAccess {
    bytes u128_balance = 1;
    uint32 num_nonces = 2;
  }
  oneof variant {
    FunctionCall function_call = 1;
    FullAccess full_access = 2;
    GasKeyFunctionCall gas_key_function_call = 3;
    GasKeyFullAccess gas_key_full_access = 4;
  }
}
