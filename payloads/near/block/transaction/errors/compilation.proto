syntax = "proto3";

package borealis.payloads.near;

// Error that can occur while preparing or executing Wasm smart-contract.
enum PrepareError {
  // Error happened while serializing the module.
  SERIALIZATION = 0;
  // Error happened while deserializing the module.
  DESERIALIZATION = 1;
  // Internal memory declaration has been found in the module.
  INTERNAL_MEMORY_DECLARED = 2;
  // Gas instrumentation failed.
  //
  // This most likely indicates the module isn't valid.
  GAS_INSTRUMENTATION = 3;
  // Stack instrumentation failed.
  //
  // This  most likely indicates the module isn't valid.
  STACK_HEIGHT_INSTRUMENTATION = 4;
  // Error happened during instantiation.
  //
  // This might indicate that `start` function trapped, or module isn't
  // instantiable and/or unlinkable.
  INSTANTIATE = 5;
  // Error creating memory.
  MEMORY = 6;
  // Contract contains too many functions.
  TOO_MANY_FUNCTIONS = 7;
  // Contract contains too many locals.
  TOO_MANY_LOCALS = 8;
  // Contract contains too many tables.
  TOO_MANY_TABLES = 9;
  // Contract contains too many table elements.
  TOO_MANY_TABLE_ELEMENTS = 10;
  // A function body in the contract exceeds the size limit.
  FUNCTION_BODY_TOO_LARGE = 11;
  // The instrumented code exceeds the size limit.
  INSTRUMENTED_CODE_TOO_LARGE = 12;
  // A function contains too many basic blocks.
  TOO_MANY_BLOCKS_PER_FUNCTION = 13;
  // A contract contains too many basic blocks.
  TOO_MANY_BLOCKS_PER_CONTRACT = 14;
  // Contract declares too many entries in the wasm type section.
  TOO_MANY_TYPES = 15;
  // All contract functions combined have more than `max_params_per_contract` parameters.
  TOO_MANY_PARAMS_PER_FUNCTION = 16;
  // A function has more than `max_params_per_function` parameters.
  TOO_MANY_PARAMS_PER_CONTRACT = 17;
  // A function's max operand-stack size (in bytes) exceeds
  // `max_operand_stack_bytes_per_function`.
  OPERAND_STACK_TOO_LARGE = 18;
}

message CompilationError {
  reserved "unsupported_compiler";
  reserved 4;
  message CodeDoesNotExist {
    string account_id = 1;
  }
  message PrepareError {
    borealis.payloads.near.PrepareError error = 1;
  }
  message WasmerCompileError {
    string msg = 1;
  }
  oneof variant {
    CodeDoesNotExist code_does_not_exist = 1;
    PrepareError prepare_error = 2;
    WasmerCompileError wasmer_compile_error = 3;
  }
}
